<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
  <title>Formulário de convite</title>
</head>
<body> 
  <div id="app">
    <main>
      <div class="main-container">
        <h1>Crie seu convite</h1>

        <form method="post" enctype="multipart/form-data">
          <fieldset class="about">
            <div class="header">
              <img src="assets/icons/calendar.svg" alt="icone de calendário">
              <legend>Sobre o evento</legend>
            </div>
            <div class="input-wrapper">
              <label for="title">Título</label>
              <input 
                type="text" 
                id="title" 
                name="title" 
                placeholder="Nome do evento"
              >
            </div>

            <div class="field-row">
              <div class="input-wrapper">
              <label for="date-start">Início</label>
              <input 
                type="datetime-local" 
                id="date-start" 
                name="date-start" 
              >
              </div>
              
              <div class="input-wrapper">
                <label for="date-end">Fim</label>
                <input 
                  type="datetime-local" 
                  id="date-end" 
                  name="date-end" 
                >
              </div>
            </div>
            
            <div class="field-row">
              <div class="input-wrapper">
                <label>Tipo</label>

                <div class="radio-wrapper">
                  <div class="radio-inner">                 
                    <input 
                      type="radio" 
                      id="type-presencial" 
                      name="type" 
                      value="presencial"
                    >
                    <img src="assets/icons/building-2.svg" alt="ícone de prédio">
                    <label for="type-presencial">Presencial</label>
                  </div>

                  <div class="radio-inner">
                    <input 
                      type="radio" 
                      id="type-online" 
                      name="type" 
                      value="online"
                    >
                    <img src="assets/icons/video.svg" alt="ícone de vídeo">
                    <label for="type-online">Online</label>
                  </div>
                </div>
              </div>
            
              <div class="input-wrapper">
                <label for="local">Local</label>
                <input 
                  type="text" 
                  id="local" 
                  name="local" 
                  placeholder="Link ou endereço"
                >
              </div>
            </div>
            

            <div class="textarea-wrapper">
              <label for="description">Descrição</label>
              <textarea name="description" id="description" cols="5" rows="35">Escreva sobre os detalhes do evento</textarea> 
            </div>

          </fieldset>

          <fieldset class="personalization">
            <div class="header">
              <img src="assets/icons/paintbrush-vertical.svg" alt="ícone de um pincel">
              <legend>Personalização</legend>
            </div>
            
            <div class="input-wrapper">
              <label>Cor principal</label>
              <div class="radio-wrapper color-wrapper">  
                
                <input type="radio" name="color" class="color-radio" id="color-blue">
                <label for="color-blue" class="color-swatch">
                  <span class="color-fill" style="background-color: var(--brand-light);"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-navy">
                <label for="color-navy" class="color-swatch">
                  <span class="color-fill" style="background-color: #6A59FF;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-purple">
                <label for="color-purple" class="color-swatch" >
                  <span class="color-fill" style="background-color: #B259FF;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-fuschia">
                <label for="color-fuschia" class="color-swatch">
                  <span class="color-fill" style="background-color: #FF59F9;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-pink">
                <label for="color-pink" class="color-swatch">
                  <span class="color-fill" style="background-color: #FF598B;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-danger">
                <label for="color-danger" class="color-swatch">
                  <span class="color-fill" style="background-color: var(--danger);"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-orange">
                <label for="color-orange" class="color-swatch">
                  <span class="color-fill" style="background-color: #FF8B59;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-yellow">
                <label for="color-yellow" class="color-swatch">
                  <span class="color-fill" style="background-color: #FFCD59;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-lime">
                <label for="color-lime" class="color-swatch">
                  <span class="color-fill" style="background-color: #E1FF59;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-green">
                <label for="color-green" class="color-swatch">
                  <span class="color-fill" style="background-color: #59FF91;"></span>
                </label>

                <input type="radio" name="color" class="color-radio" id="color-cyan">
                <label for="color-cyan" class="color-swatch">
                  <span class="color-fill" style="background-color: #59FFF9;"></span>
                </label>

              </div>
            </div>

            <div class="input-wrapper">
              <label for="theme">Tema do evento</label>
              <div class="theme-wrapper">
                <div class="theme-radio">
                  <input type="radio" name="theme" id="anniversary">
                  <img src="assets/images/anniversary.jpg" alt="Imagem de um aniversário">
                  <label for="anniversary">Aniversário</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="children">
                  <img src="assets/images/infant.jpg" alt="Imagem de festa infantil">
                  <label for="children">Infantil</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="graduation">
                  <img src="assets/images/graduation.jpg" alt="Imagem de graduação">
                  <label for="graduation">Formatura</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="marriage">
                  <img src="assets/images/marriage.jpg" alt="Imagem de casamento">
                  <label for="marriage">Formatura</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="baby-shower">
                  <img src="assets/images/baby-shower.jpg" alt="Imagem de um chá de bebe">
                  <label for="baby-shower">Chá de bebê</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="bridal-shower">
                  <img src="assets/images/bridal-shower.jpg" alt="Imagem de um chá de panela">
                  <label for="bridal-shower">Chá de panela</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="carnival">
                  <img src="assets/images/carnival.jpg" alt="Imagem de carnaval">
                  <label for="carnival">Carnaval</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="easter">
                  <img src="assets/images/easter.jpg" alt="Imagem de páscoa">
                  <label for="easter">Páscoa</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="sao-joao">
                  <img src="assets/images/sao-joao.jpg" alt="Imagem de pessoas celebrando o São João">
                  <label for="sao-joao">São João</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="halloween">
                  <img src="assets/images/halloween.jpg" alt="Imagem do Halloween">
                  <label for="halloween">Halloween</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="christmas">
                  <img src="assets/images/christmas.jpg" alt="Imagem do natal">
                  <label for="christmas">Natal</label>
                </div>

                <div class="theme-radio">
                  <input type="radio" name="theme" id="other">
                  <img src="assets/images/other.jpg" alt="Imagem de pessoas comemorando">
                  <label for="other">Outro</label>
                </div>
              </div>
            </div>

            <div class="field-row">        
                <div class="checkbox-wrapper input-wrapper">
                  <label>Estilo</label>
                  <input type="checkbox" class="toggle-checkbox" name="dark-mode" id="dark">
                  <label for="dark" class="toggle-switch">
                    <span class="label-dark">Escuro</span>
                    <span class="label-light">Claro</span>
                  </label>              
                </div>       
              
                <div class="file-wrapper input-wrapper">
                  <label>Foto de capa</label>
                  <input type="file" name="cover" id="cover">
                  <div class="file-actions">
                    <label for="cover" class="file-button">
                      <img src="assets/icons/upload.svg" alt="ícone para upload">
                      Selecionar
                    </label>            
                    <p>Nenhum arquivo selecionado</p>
                  </div>
                </div>
            </div>              
          </fieldset>

          <fieldset class="contact-data">
            <div class="header">
            <img src="assets/icons/contact.svg" alt="ícone de contato">
            <legend>Dados para contato</legend>

            </div>
            
            <div class="input-wrapper">
              <label>Nome</label>
              <input 
                type="text" 
                name="name-contact" 
                id="name-contact"
                placeholder="Nome completo"
              >
            </div>

            <div class="field-row">
              <div class="input-wrapper">
                <label>E-mail</label>
                <input 
                  type="text" 
                  name="email-contact" 
                  id="email-contact"
                  placeholder="exemplo@email.com"
                >
              </div>

              <div class="input-wrapper">
                <label>Telefone</label>
                <input 
                  type="text" 
                  name="tel-contact" 
                  id="tel-contact"
                  placeholder="(99) 99999-9999">
              </div>
            </div>
          </fieldset>

          <hr>

          <div class="footer">

            <div class="footer-items">
              <div class="checkbox-row">
                <div class="checkbox-image"></div>
                <input type="checkbox" name="terms" id="terms">
                <label for="terms">Li e concordo com os <strong>Termos e Condições</strong> e com a <strong>Política de Privacidade</strong></label>
              </div>
              
              <div class="checkbox-row">
                <div class="checkbox-image"></div>
                <input type="checkbox" name="email-updates" id="email-updates">
                <label for="email-updates">Aceito receber atualizações e promoções por e-mail</label>
              </div>
              
              <div class="checkbox-row">
                <div class="checkbox-image"></div>
                <input type="checkbox" name="sms-updates" id="sms-updates">
                <label for="sms-updates">Aceito receber atualizações e promoções por SMS</label>
              </div>
            </div>
              
            <div class="action-wrapper">
              <button>
                <img src="assets/icons/ticket.svg" alt="ícone de ticket">
                <span>Gerar convite</span>
              </button>
            </div>

          </div>
        </form>
      </div>
    </main>
    
    
    <aside>
      <div class="aside-container">
        <header>
          <img src="assets/Logo.svg" alt="ícone da logo" class="logo">
          <h2>Festivite</h2>
          <p>Crie um convite digital para o seu evento</p>
        </header>
      </div>
    </aside>
  </div>
  
</body>
</html>
