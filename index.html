<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
  <title>Formulário de convite</title>
</head>
<body> 
  <div id="app">
    <main>
      <div class="main-container">
        <h1>Crie seu convite</h1>

        <form method="post" enctype="multipart/form-data">
          <fieldset class="about">
            <img src="assets/icons/calendar.svg" alt="icone de calendário">
            <legend>Sobre o evento</legend>

            <div class="input-wrapper">
              <label for="title">Título</label>
              <input 
                type="text" 
                id="title" 
                name="title" 
                placeholder="Nome do evento"
              >
            </div>

            <div class="input-wrapper">
              <label for="date-start">Início</label>
              <input 
                type="datetime-local" 
                id="date-start" 
                name="date-start" 
                lang="pt-BR"
              >
            </div>
              
            <div class="input-wrapper">
              <label for="date-end">Fim</label>
              <input 
                type="datetime-local" 
                id="date-end" 
                name="date-end" 
                lang="pt-BR"
              >
            </div>

            <div class="input-wrapper">
              <label>Tipo</label>

              <div class="radio-wrapper">
                <div class="radio-inner">                 
                  <input 
                    type="radio" 
                    id="type-presencial" 
                    name="type" 
                    value="presencial"
                  >
                  <img src="assets/icons/building-2.svg" alt="ícone de prédio">
                  <label for="type-presencial">Presencial</label>
                </div>

                <div class="radio-inner">
                  <input 
                    type="radio" 
                    id="type-online" 
                    name="type" 
                    value="online"
                  >
                  <img src="assets/icons/video.svg" alt="ícone de vídeo">
                  <label for="type-online">Online</label>
                </div>
              </div>
            </div>
            
            <div class="input-wrapper">
              <label for="local">Local</label>
              <input 
                type="text" 
                id="local" 
                name="local" 
                placeholder="Link ou endereço"
              >
            </div>

            <div class="textarea-wrapper">
              <label for="description">Descrição</label>
              <textarea  
                name="description" 
                id="description"
                cols="45"
                rows="7"
                placeholder="Descreva sobre os detalhes do evento">
              </textarea>
            </div>

          </fieldset>
        </form>
      </div>
    </main>
    
    <aside>
      <div class="aside-container">
        <header>
          <img src="assets/Logo.svg" alt="ícone da logo">
          <h2>Festivite</h2>
          <p>Crie um convite digital para o seu evento</p>
        </header>
      </div>
    </aside>
  </div>
  
</body>
</html>
